<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Задание 3: MindAR Face Tracking AR Mask</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 10px;
      background: rgba(18, 18, 28, 0.85);
      padding: 8px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .effect-btn {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .effect-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .effect-btn.active {
      background: linear-gradient(135deg, #0984e3, #6c5ce7);
      box-shadow: 0 2px 10px rgba(108, 92, 231, 0.5);
    }
    #status-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      color: #fff;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 14px;
      border-radius: 12px;
      pointer-events: none;
    }
  </style>

  <!-- A-Frame 1.5.0 & MindAR Face 1.2.5 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
</head>
<body>
  <div id="ui-container">
    <button class="effect-btn active" data-effect="glasses">🕶 Очки</button>
    <button class="effect-btn" data-effect="mask">🎭 Неоновая маска</button>
    <button class="effect-btn" data-effect="horns">👑 Корона / Рога</button>
    <button class="effect-btn" data-effect="none">✖ Выкл</button>
  </div>

  <div id="status-hint">Направьте камеру на лицо</div>

  <a-scene
    mindar-face="filterMinCF: 0.0001; filterBeta: 1"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls-enabled="false"></a-camera>
    
    <a-light type="ambient" intensity="0.9"></a-light>
    <a-light type="directional" intensity="1.2" position="0 1 1"></a-light>

    <!-- Эффект 1: Очки (anchorIndex 168 - переносица между глаз) -->
    <a-entity mindar-face-target="anchorIndex: 168" id="glassesTarget">
      <a-entity id="glassesEntity" visible="true">
        <!-- Левая линза -->
        <a-cylinder position="-0.32 0 0.1" rotation="90 0 0" radius="0.22" height="0.04" color="#111111" material="roughness: 0.1; metalness: 0.9; opacity: 0.88; transparent: true"></a-cylinder>
        <!-- Правая линза -->
        <a-cylinder position="0.32 0 0.1" rotation="90 0 0" radius="0.22" height="0.04" color="#111111" material="roughness: 0.1; metalness: 0.9; opacity: 0.88; transparent: true"></a-cylinder>
        <!-- Перемычка -->
        <a-box position="0 0.04 0.1" width="0.22" height="0.03" depth="0.03" color="#f1c40f" material="metalness: 0.9; roughness: 0.2"></a-box>
        <!-- Оправа левая/правая -->
        <a-torus position="-0.32 0 0.1" radius="0.22" radius-tubular="0.015" color="#f1c40f" material="metalness: 0.9; roughness: 0.2"></a-torus>
        <a-torus position="0.32 0 0.1" radius="0.22" radius-tubular="0.015" color="#f1c40f" material="metalness: 0.9; roughness: 0.2"></a-torus>
      </a-entity>
    </a-entity>

    <!-- Эффект 2: Неоновая кибер-маска (anchorIndex 1 - кончик носа) -->
    <a-entity mindar-face-target="anchorIndex: 1" id="maskTarget">
      <a-entity id="maskEntity" visible="false">
        <a-cone position="0 -0.15 0.15" rotation="180 0 0" radius-bottom="0.45" radius-top="0.1" height="0.6" color="#00cec9" material="wireframe: true; wireframeLinewidth: 2; emissive: #00cec9; emissiveIntensity: 0.8"></a-cone>
        <a-sphere position="-0.25 -0.2 0.2" radius="0.08" color="#ff7675" material="emissive: #ff7675; emissiveIntensity: 1"></a-sphere>
        <a-sphere position="0.25 -0.2 0.2" radius="0.08" color="#ff7675" material="emissive: #ff7675; emissiveIntensity: 1"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- Эффект 3: Корона (anchorIndex 10 - верхняя точка лба) -->
    <a-entity mindar-face-target="anchorIndex: 10" id="hornsTarget">
      <a-entity id="hornsEntity" visible="false" position="0 0.25 0">
        <!-- Центральный пик -->
        <a-cone position="0 0.3 0" radius-bottom="0.08" radius-top="0.01" height="0.4" color="#fdcb6e" material="metalness: 0.9; roughness: 0.2"></a-cone>
        <!-- Левый пик -->
        <a-cone position="-0.25 0.2 0" rotation="0 0 20" radius-bottom="0.07" radius-top="0.01" height="0.35" color="#fdcb6e" material="metalness: 0.9; roughness: 0.2"></a-cone>
        <!-- Правый пик -->
        <a-cone position="0.25 0.2 0" rotation="0 0 -20" radius-bottom="0.07" radius-top="0.01" height="0.35" color="#fdcb6e" material="metalness: 0.9; roughness: 0.2"></a-cone>
        <!-- Обод короны -->
        <a-torus position="0 0.05 0" rotation="90 0 0" radius="0.4" radius-tubular="0.03" color="#e17055" material="metalness: 0.8; roughness: 0.3"></a-torus>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    const buttons = document.querySelectorAll('.effect-btn');
    const glasses = document.getElementById('glassesEntity');
    const mask = document.getElementById('maskEntity');
    const horns = document.getElementById('hornsEntity');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const effect = btn.getAttribute('data-effect');
        glasses.setAttribute('visible', effect === 'glasses');
        mask.setAttribute('visible', effect === 'mask');
        horns.setAttribute('visible', effect === 'horns');
      });
    });
  </script>
</body>
</html>
