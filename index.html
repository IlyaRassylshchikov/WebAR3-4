<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Задание 3: MindAR Face Tracking</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }
    #effect-selector {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid #0984e3;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }
    #nav-link {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.8);
      color: #00cec9;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
    }
  </style>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
</head>
<body>
  <select id="effect-selector">
    <option value="glasses">🕶 Очки 3D</option>
    <option value="mask">🎭 Маска</option>
    <option value="none">— Без эффекта —</option>
  </select>

  <a href="task4.html" id="nav-link">К Заданию 4 ➔</a>

  <a-scene
    mindar-face="filterMinCF: 0.0001; filterBeta: 1"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="glassesModel" src="glasses.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls-enabled="false"></a-camera>
    
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" intensity="1.5" position="0 1 1"></a-light>

    <!-- ОЧКИ: якорь 168 (переносица) -->
    <a-entity mindar-face-target="anchorIndex: 168" id="glassesAnchor">
      <a-gltf-model
        id="glassesEntity"
        src="#glassesModel"
        position="0 0 -0.1"
        scale="0.35 0.35 0.35"
        visible="true">
      </a-gltf-model>
    </a-entity>

    <!-- МАСКА: якорь 1 (нос) -->
    <a-entity mindar-face-target="anchorIndex: 1" id="maskAnchor">
      <a-entity id="maskEntity" visible="false">
        <a-cone position="0 -0.15 0.15" rotation="180 0 0" radius-bottom="0.45" radius-top="0.1" height="0.6" color="#00cec9" material="wireframe: true; wireframeLinewidth: 2; emissive: #00cec9; emissiveIntensity: 1"></a-cone>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    const selector = document.getElementById('effect-selector');
    const glassesAnchor = document.getElementById('glassesAnchor');
    const maskAnchor = document.getElementById('maskAnchor');

    selector.addEventListener('change', (e) => {
      const val = e.target.value;
      
      // Переключаем видимость не у модели, а у самого AR-таргета (это 100% надёжно в MindAR)
      if (val === 'glasses') {
        glassesAnchor.object3D.visible = true;
        maskAnchor.object3D.visible = false;
      } else if (val === 'mask') {
        glassesAnchor.object3D.visible = false;
        maskAnchor.object3D.visible = true;
      } else {
        glassesAnchor.object3D.visible = false;
        maskAnchor.object3D.visible = false;
      }
    });
  </script>
</body>
</html>
