<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Задание 3: MindAR Face Tracking AR Mask</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 10px;
      background: rgba(18, 18, 28, 0.85);
      padding: 8px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .effect-btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .effect-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .effect-btn.active {
      background: linear-gradient(135deg, #0984e3, #6c5ce7);
      box-shadow: 0 2px 10px rgba(108, 92, 231, 0.5);
    }
    #nav-link {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(0,0,0,0.7);
      color: #00cec9;
      padding: 8px 14px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 13px;
      border: 1px solid #00cec9;
    }
    #status-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      color: #fff;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 14px;
      border-radius: 12px;
      pointer-events: none;
    }
  </style>

  <!-- A-Frame 1.5.0 & MindAR Face 1.2.5 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
</head>
<body>
  <div id="ui-container">
    <button class="effect-btn active" data-effect="glasses">🕶 Очки 3D</button>
    <button class="effect-btn" data-effect="mask">🎭 Неоновая маска</button>
    <button class="effect-btn" data-effect="none">✖ Без эффекта</button>
  </div>

  <div id="status-hint">Направьте камеру на лицо</div>
  <a href="task4.html" id="nav-link">Перейти к Заданию 4 (Hit-Test) ➔</a>

  <a-scene
    mindar-face="filterMinCF: 0.0001; filterBeta: 1"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Настоящая 3D-модель стильных очков -->
      <a-asset-item id="glassesModel" src="./glasses.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls-enabled="false"></a-camera>
    
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" intensity="1.5" position="0 1 2"></a-light>

    <!-- ЭФФЕКТ 1: 3D Модель очков (якорь 168 - переносица) -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model
        id="glassesEntity"
        src="#glassesModel"
        position="0 0 -0.1"
        scale="0.38 0.38 0.38"
        visible="true">
      </a-gltf-model>
    </a-entity>

    <!-- ЭФФЕКТ 2: Неоновая маска (якорь 1 - кончик носа) -->
    <a-entity mindar-face-target="anchorIndex: 1">
      <a-entity id="maskEntity" visible="false">
        <a-cone position="0 -0.15 0.15" rotation="180 0 0" radius-bottom="0.45" radius-top="0.1" height="0.6" color="#00cec9" material="wireframe: true; wireframeLinewidth: 2; emissive: #00cec9; emissiveIntensity: 0.8"></a-cone>
        <a-sphere position="-0.25 -0.2 0.2" radius="0.08" color="#ff7675" material="emissive: #ff7675; emissiveIntensity: 1"></a-sphere>
        <a-sphere position="0.25 -0.2 0.2" radius="0.08" color="#ff7675" material="emissive: #ff7675; emissiveIntensity: 1"></a-sphere>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    const buttons = document.querySelectorAll('.effect-btn');
    const glasses = document.getElementById('glassesEntity');
    const mask = document.getElementById('maskEntity');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const effect = btn.getAttribute('data-effect');
        glasses.setAttribute('visible', effect === 'glasses');
        mask.setAttribute('visible', effect === 'mask');
      });
    });
  </script>
</body>
</html>
