<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Задание 4: Three.js + WebXR hit-test</title>

  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #111; color: #fff; }

    /* Стартовый экран */
    #start {
      position: fixed; inset: 0; display: grid; place-items: center;
      padding: 24px; text-align: center;
    }
    #start h1 { font-size: 26px; margin: 0 0 12px; }
    #start p { color: #bbb; max-width: 420px; margin: 0 auto 20px; line-height: 1.5; }
    button {
      border: 0; border-radius: 999px; padding: 14px 26px;
      font: 600 16px system-ui, sans-serif; background: #c8246a; color: #fff;
    }
    button:disabled { background: #555; }

    /* Подсказки поверх камеры (dom-overlay) */
    #overlay { display: none; }
    #hint {
      position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
      background: rgba(0,0,0,.6); padding: 10px 16px; border-radius: 999px;
      font-size: 15px; white-space: nowrap;
    }
    #reset { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); }
  </style>

  <!-- Говорим браузеру, откуда брать Three.js (ES-модули с CDN) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="start">
    <div>
      <h1>Размести объект на полу</h1>
      <p id="info">Проверяю поддержку WebXR…</p>
      <button id="ar-btn" disabled>Запустить AR</button>
    </div>
  </div>

  <!-- Элементы, которые видны поверх камеры во время AR-сессии -->
  <div id="overlay">
    <div id="hint">Медленно поводи телефоном над полом</div>
    <button id="reset">Убрать объекты</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ---------- Настройки ----------
    const MODEL_URL = 'model.glb';  // своя модель (если файла нет, будет куб)
    const MODEL_SIZE = 0.5;         // наибольший размер модели в метрах

    const info = document.getElementById('info');
    const arBtn = document.getElementById('ar-btn');
    const overlay = document.getElementById('overlay');
    const hint = document.getElementById('hint');

    // ---------- 1. Сцена, камера, рендерер ----------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // alpha: фон прозрачный, сквозь него видно камеру
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;   // включаем поддержку WebXR в Three.js
    document.body.appendChild(renderer.domElement);

    // ---------- 2. Освещение ----------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.5)); // мягкий свет сверху и снизу
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);          // направленный свет для объёма
    sun.position.set(1, 3, 2);
    scene.add(sun);

    // ---------- 3. Визуальный маркер (кольцо) ----------
    // Кольцо лежит в плоскости XZ (на полу). Его положение каждый кадр
    // задаёт результат hit-test, поэтому matrixAutoUpdate выключен.
    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.08, 0.11, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // ---------- 4. Объект для размещения ----------
    // Пытаемся загрузить model.glb. Если не вышло, используем куб.
    let template = makeCube();

    function makeCube() {
      const s = 0.2; // куб 20 см
      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(s, s, s),
        new THREE.MeshStandardMaterial({ color: 0xc8246a, roughness: 0.4 })
      );
      cube.position.y = s / 2;          // ставим куб дном на пол, а не центром
      const group = new THREE.Group();
      group.add(cube);
      return group;
    }

    new GLTFLoader().load(MODEL_URL, (gltf) => {
      const model = gltf.scene;
      // Подгоняем модель под MODEL_SIZE метров (модели из интернета бывают огромными)
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const k = MODEL_SIZE / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(k);
      // Центрируем по X и Z и ставим дном на пол (y = 0)
      const center = box.getCenter(new THREE.Vector3());
      model.position.set(-center.x * k, -box.min.y * k, -center.z * k);
      const group = new THREE.Group();
      group.add(model);
      template = group;
      console.log('Модель загружена:', MODEL_URL);
    }, undefined, () => console.log('model.glb не найден, используется куб'));

    const placed = [];  // все размещённые объекты

    // ---------- 5. Проверка поддержки WebXR ----------
    if (!navigator.xr) {
      info.textContent = 'Этот браузер не поддерживает WebXR. Открой страницу в Chrome на Android (нужны «Сервисы Google Play для AR»). На iPhone WebXR не работает.';
    } else {
      navigator.xr.isSessionSupported('immersive-ar').then((ok) => {
        if (ok) {
          info.textContent = 'Нажми кнопку, наведи камеру на пол и тапни по экрану, чтобы поставить объект.';
          arBtn.disabled = false;
        } else {
          info.textContent = 'AR-режим WebXR на этом устройстве не поддерживается. Нужен Android-телефон с Chrome и ARCore (или эмулятор WebXR на компьютере).';
        }
      });
    }
    if (!window.isSecureContext) {
      info.textContent = 'Страница открыта без HTTPS, WebXR работать не будет. Открой https-ссылку (GitHub Pages) или localhost.';
    }

    // ---------- 6. Запуск AR-сессии ----------
    let hitTestSource = null;

    arBtn.addEventListener('click', async () => {
      try {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],                // без hit-test задание не имеет смысла
          optionalFeatures: ['local-floor', 'dom-overlay'],
          domOverlay: { root: overlay }                   // подсказки поверх камеры
        });

        // Система отсчёта: local-floor (начало координат на уровне пола).
        // Если устройство её не даёт, берём local.
        let spaceType = 'local-floor';
        try { await session.requestReferenceSpace('local-floor'); }
        catch { spaceType = 'local'; }
        renderer.xr.setReferenceSpaceType(spaceType);
        console.log('Reference space:', spaceType);

        await renderer.xr.setSession(session);

        // Источник hit-test: луч из центра экрана («viewer» = положение телефона)
        const viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

        document.getElementById('start').style.display = 'none';
        overlay.style.display = 'block';

        session.addEventListener('end', () => {
          hitTestSource = null;
          reticle.visible = false;
          overlay.style.display = 'none';
          document.getElementById('start').style.display = 'grid';
        });
      } catch (err) {
        info.textContent = 'Не удалось запустить AR: ' + err.message;
        console.error(err);
      }
    });

    // ---------- 7. Тап по экрану: ставим объект ----------
    // В AR тап по экрану приходит как событие select у контроллера.
    const controller = renderer.xr.getController(0);
    controller.addEventListener('select', () => {
      if (!reticle.visible) return;                  // поверхность не найдена, ставить некуда
      const obj = template.clone();
      obj.position.setFromMatrixPosition(reticle.matrix);  // в точку hit-test
      // Поворачиваем объект «лицом» к пользователю (только вокруг вертикальной оси)
      const camPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
      obj.rotation.y = Math.atan2(camPos.x - obj.position.x, camPos.z - obj.position.z);
      scene.add(obj);   // добавляем в СЦЕНУ (мировые координаты), а не к камере
      placed.push(obj);
      hint.textContent = 'Объект поставлен. Можно обойти его вокруг';
    });
    scene.add(controller);

    // Кнопка «Убрать объекты». beforexrselect не даёт тапу по кнопке
    // одновременно поставить новый объект.
    overlay.addEventListener('beforexrselect', (e) => e.preventDefault());
    document.getElementById('reset').addEventListener('click', () => {
      placed.forEach((o) => scene.remove(o));
      placed.length = 0;
      hint.textContent = 'Тапни, чтобы поставить объект';
    });

    // ---------- 8. Цикл отрисовки: каждый кадр двигаем кольцо ----------
    renderer.setAnimationLoop((timestamp, frame) => {
      if (frame && hitTestSource) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length > 0) {
          // Положение точки пересечения в нашей системе отсчёта (local-floor)
          const pose = results[0].getPose(referenceSpace);
          reticle.matrix.fromArray(pose.transform.matrix);
          reticle.visible = true;
          if (placed.length === 0) hint.textContent = 'Тапни, чтобы поставить объект';
        } else {
          reticle.visible = false;
          if (placed.length === 0) hint.textContent = 'Медленно поводи телефоном над полом';
        }
      }
      renderer.render(scene, camera);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
